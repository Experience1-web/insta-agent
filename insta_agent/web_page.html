<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insta-agent</title>
<style>
  :root {
    --bg: #0f1115;
    --flaeche: #171a21;
    --rand: #262b36;
    --text: #e8e6e1;
    --leise: #8b93a3;
    --akzent: #e4572e;
    --gut: #4ade80;
    --warnung: #fbbf24;
    --schlecht: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 80px;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .huelle { max-width: 1000px; margin: 0 auto; }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 28px 0 20px; border-bottom: 3px solid var(--akzent); margin-bottom: 28px;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;
       color: var(--leise); margin: 32px 0 12px; font-weight: 600; }
  .motto { color: var(--akzent); font-style: italic; }
  .karte {
    background: var(--flaeche); border: 1px solid var(--rand);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 14px;
  }
  .kacheln { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .kachel { background: var(--flaeche); border: 1px solid var(--rand);
            border-radius: 10px; padding: 14px 16px; }
  .kachel .wert { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kachel .name { font-size: 12px; color: var(--leise); text-transform: uppercase;
                  letter-spacing: 0.06em; margin-top: 2px; }
  .zeile { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--rand);
    background: var(--bg); color: var(--text); padding: 10px 12px;
  }
  input { flex: 1; min-width: 220px; }
  button {
    background: var(--akzent); border-color: var(--akzent); color: #fff;
    font-weight: 600; cursor: pointer; padding: 10px 22px;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  pre {
    background: #0a0c0f; border: 1px solid var(--rand); border-radius: 8px;
    padding: 14px; overflow: auto; max-height: 320px;
    font: 13px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; margin: 0;
  }
  .gitter { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .post img { width: 100%; border-radius: 8px 8px 0 0; display: block; background: #000; }
  .post { background: var(--flaeche); border: 1px solid var(--rand);
          border-radius: 10px; overflow: hidden; }
  .post .text { padding: 14px 16px; }
  .post .caption { white-space: pre-wrap; font-size: 14px; }
  .tags { color: var(--leise); font-size: 13px; margin-top: 10px; word-break: break-word; }
  .marke { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
           background: var(--rand); color: var(--leise); text-transform: uppercase;
           letter-spacing: 0.06em; }
  .marke.live { background: var(--gut); color: #05240f; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dt { color: var(--leise); }
  dd { margin: 0; }
  ul { margin: 6px 0 0; padding-left: 20px; }
  .hinweis { color: var(--leise); font-size: 14px; }
  .gut { color: var(--gut); } .warnung { color: var(--warnung); } .schlecht { color: var(--schlecht); }
  .puls { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
          background: var(--gut); animation: puls 1.1s infinite; }
  @keyframes puls { 50% { opacity: 0.25; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rand); }
  th { color: var(--leise); font-weight: 600; font-size: 12px;
       text-transform: uppercase; letter-spacing: 0.06em; }
  td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="huelle">

<header>
  <h1 id="titel">insta-agent</h1>
  <span class="motto" id="motto"></span>
  <span style="margin-left:auto" id="zustand"></span>
</header>

<div id="warnbox"></div>

<h2>Kasse</h2>
<div class="kacheln" id="kasse"></div>

<h2 id="steuerungstitel">Arbeiten lassen</h2>
<div class="karte" id="steuerung">
  <div class="zeile">
    <select id="zyklen">
      <option value="1">1 Zyklus</option>
      <option value="3">3 Zyklen</option>
      <option value="7">7 Zyklen (eine Woche)</option>
    </select>
    <input id="hinweis" placeholder="Wunsch für die Nische (optional – sonst entscheidet er allein)">
    <button id="start">Starten</button>
  </div>
  <p class="hinweis" id="starthinweis" style="margin:12px 0 0">
    Der erste Lauf dauert einige Minuten. Veröffentlicht wird nichts – es entstehen nur Entwürfe.
  </p>
</div>

<div id="protokollbox" style="display:none">
  <h2>Was er gerade tut</h2>
  <pre id="protokoll"></pre>
</div>

<div id="profilbox"></div>
<div id="kursbox"></div>
<div id="postbox"></div>
<div id="planbox"></div>

</div>

<script>
// Das Zugangswort steht beim ersten Aufruf in der Adresse. Es wandert in
// den Speicher des Browsers, damit man es beim nächsten Mal nicht braucht -
// und verschwindet aus der Adresszeile, damit es nicht im Verlauf landet.
const TOKEN_SCHLUESSEL = "insta-agent-token";
(() => {
  const aus_adresse = new URLSearchParams(location.search).get("token");
  if (aus_adresse) {
    try { localStorage.setItem(TOKEN_SCHLUESSEL, aus_adresse); } catch {}
    history.replaceState({}, "", location.pathname);
  }
})();
const token = (() => {
  try { return localStorage.getItem(TOKEN_SCHLUESSEL) || ""; } catch { return ""; }
})();
const kopf = token ? { "X-Token": token } : {};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const geld = n => (n ?? 0).toFixed(n < 1 && n > -1 ? 4 : 2) + " USD";

let laeuftGerade = false;

async function laden() {
  let d;
  try {
    const antwort = await fetch("/api/zustand", { headers: kopf });
    if (antwort.status === 403) {
      $("zustand").innerHTML = '<span class="schlecht">Kein Zugang</span>';
      $("warnbox").innerHTML = `<div class="karte"><strong class="schlecht">Zugangswort fehlt</strong>
        <p class="hinweis" style="margin:8px 0 0">Ruf die Seite noch einmal mit der vollständigen
        Adresse auf, die beim Start angezeigt wurde – die mit <code>?token=…</code> am Ende.</p></div>`;
      return;
    }
    d = await antwort.json();
  } catch {
    $("zustand").innerHTML = '<span class="schlecht">Keine Verbindung zum Agenten</span>';
    return;
  }
  zeichne(d);
}

function zeichne(d) {
  laeuftGerade = d.laeuft;

  // Nur-Lesen: die Steuerung verschwindet, statt einen Knopf anzubieten,
  // der ohnehin abgelehnt würde.
  const steuerung_sichtbar = d.nur_lesen ? "none" : "";
  $("steuerung").style.display = steuerung_sichtbar;
  $("steuerungstitel").style.display = steuerung_sichtbar;

  $("start").disabled = d.laeuft;
  $("start").textContent = d.laeuft ? "Läuft …" : "Starten";
  $("zustand").innerHTML = d.laeuft
    ? '<span class="puls"></span> arbeitet'
    : '<span class="hinweis">bereit</span>';

  // Warnungen, die das Weiterarbeiten verhindern
  let warn = "";
  if (!d.schluessel_da) {
    warn = `<div class="karte"><strong class="schlecht">Kein API-Schlüssel hinterlegt.</strong>
      <p class="hinweis" style="margin:8px 0 0">Trag ihn im Terminal ein:
      <code>py -m insta_agent.cli setup</code></p></div>`;
  } else if (d.fehler) {
    warn = `<div class="karte"><strong class="schlecht">Abgebrochen</strong>
      <p style="margin:8px 0 0">${esc(d.fehler)}</p></div>`;
  }
  $("warnbox").innerHTML = warn;

  // Kasse
  const k = d.kasse;
  const farbe = { normal: "gut", frugal: "warnung", halted: "schlecht" }[k.modus] || "";
  $("kasse").innerHTML = `
    ${kachel(geld(k.kontostand), "Kontostand")}
    ${kachel(geld(k.ausgegeben), "Fürs Denken ausgegeben")}
    ${kachel(geld(k.verdient), "Selbst verdient")}
    ${kachel(`<span class="${farbe}">${esc(k.modus)}</span>`, "Betriebsmodus")}
    ${kachel(deckung(k.deckung), "Kostendeckung")}`;

  // Protokoll
  const zeigen = d.laeuft || (d.protokoll && d.protokoll.length);
  $("protokollbox").style.display = zeigen ? "" : "none";
  if (zeigen) {
    const p = $("protokoll");
    const unten = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
    p.textContent = d.protokoll.join("\n");
    if (unten) p.scrollTop = p.scrollHeight;
  }

  // Profil
  const i = d.identitaet;
  $("titel").textContent = i ? i.agent_name : "insta-agent";
  $("motto").textContent = i ? i.motto : "";
  document.title = i ? `${i.agent_name} · @${i.handle}` : "insta-agent";
  $("profilbox").innerHTML = !i ? "" : `
    <h2>Wer er ist und was er aufbaut</h2>
    <div class="karte"><dl>
      <dt>Sein Name</dt><dd><strong>${esc(i.agent_name)}</strong>
        <div class="hinweis">${esc(i.agent_why)}</div></dd>
      <dt>Account</dt><dd>@${esc(i.handle)} – ${esc(i.display_name)}</dd>
      <dt>Nische</dt><dd>${esc(i.niche)}</dd>
      <dt>Zielgruppe</dt><dd>${esc(i.target_audience)}</dd>
      <dt>Tonfall</dt><dd>${esc(i.tone_of_voice)}</dd>
      <dt>Bildsprache</dt><dd>${esc(i.visual_identity)}</dd>
      <dt>Säulen</dt><dd>${i.content_pillars.map(esc).join(" · ")}</dd>
      <dt>Bio</dt><dd>${esc(i.bio)}</dd>
      <dt>Warum</dt><dd>${esc(i.why_this_works)}</dd>
    </dl></div>`;

  // Kurs
  const s = d.strategie;
  $("kursbox").innerHTML = !s ? "" : `
    <h2>Kurs dieser Woche</h2>
    <div class="karte">
      <strong>${esc(s.current_goal)}</strong>
      <p style="margin:10px 0">${esc(s.reasoning)}</p>
      <dl>
        <dt>Taktung</dt><dd>${esc(s.posting_cadence)}</dd>
        <dt>Kennzahlen</dt><dd>${s.kpis_to_watch.map(esc).join(", ")}</dd>
        <dt>Änderungen</dt><dd>${s.changes.map(esc).join("; ") || "keine"}</dd>
        <dt>Experimente</dt><dd>${s.experiments.map(esc).join("; ") || "keine"}</dd>
      </dl>
    </div>`;

  // Entwürfe
  $("postbox").innerHTML = !d.entwuerfe.length ? "" : `
    <h2>Seine Beiträge</h2>
    <div class="gitter">${d.entwuerfe.map(p => `
      <div class="post">
        ${p.bild ? `<img src="/media?name=${encodeURIComponent(p.bild)}${
          token ? "&token=" + encodeURIComponent(token) : ""}" alt="" loading="lazy">` : ""}
        <div class="text">
          <span class="marke ${p.status === "published" ? "live" : ""}">${
            p.status === "published" ? "veröffentlicht" : "Entwurf"}</span>
          <span class="marke">${esc(p.saeule)}</span>
          <p class="caption" style="margin:10px 0 0">${esc(p.caption)}</p>
          <div class="tags">${p.hashtags.map(h => "#" + esc(h)).join(" ")}</div>
        </div>
      </div>`).join("")}</div>`;

  // Geschäftsideen
  const pl = d.plan;
  $("planbox").innerHTML = !pl ? "" : `
    <h2>Wie er Geld verdienen will</h2>
    <div class="karte">
      <table>
        <tr><th>Idee</th><th>Modell</th><th class="zahl">Preis</th>
            <th class="zahl">ab Followern</th><th class="zahl">USD/Monat</th></tr>
        ${pl.ideas.map(x => `<tr>
          <td>${esc(x.name)}${x.name === pl.recommended_now ? ' <span class="marke live">jetzt</span>' : ""}</td>
          <td>${esc(x.revenue_model)}</td>
          <td class="zahl">${x.price_point_usd.toFixed(2)}</td>
          <td class="zahl">${x.required_followers}</td>
          <td class="zahl">${Math.round(x.monthly_revenue_estimate_usd)}</td>
        </tr>`).join("")}
      </table>
      <p style="margin:16px 0 6px"><strong>Was du selbst erledigen musst:</strong></p>
      <ul>${pl.what_the_operator_must_do.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>`;
}

// Bei winzigen Ausgaben ergeben sich absurd wirkende Prozentzahlen.
const deckung = q => (q > 9.99 ? "&gt;999" : Math.round(q * 100)) + " %";

const kachel = (wert, name) =>
  `<div class="kachel"><div class="wert">${wert}</div><div class="name">${name}</div></div>`;

$("start").onclick = async () => {
  $("start").disabled = true;
  const antwort = await fetch("/api/start", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...kopf },
    body: JSON.stringify({ zyklen: +$("zyklen").value, hinweis: $("hinweis").value }),
  });
  if (!antwort.ok) {
    const d = await antwort.json();
    alert(d.grund || "Start nicht möglich.");
  }
  setTimeout(laden, 300);
};

laden();
// Während der Arbeit häufiger nachsehen, sonst sparsam.
setInterval(() => laden(), 2000);
</script>
</body>
</html>
