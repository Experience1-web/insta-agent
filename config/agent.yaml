# Eingestellt auf ein kleines Startguthaben von etwa 5 USD.
#
# Der allererste Zyklus ist der teuerste: Der Agent recherchiert im Web,
# erfindet sich, legt seine Strategie fest und schreibt den ersten Post.
# Danach wird es deutlich billiger - die Recherche läuft nur noch alle
# sieben Zyklen.

llm:
  model: claude-opus-5           # die eigentlichen Entscheidungen
  research_model: claude-sonnet-5  # Websuche: braucht kein Spitzenmodell
  research_effort: medium
  max_web_searches: 4            # jede Suche kostet
  cheap_model: claude-haiku-4-5  # Routinearbeit
  fallback_model: claude-opus-4-8
  effort: high
  max_tokens: 16000

economy:
  treasury_start_usd: 5.00
  low_balance_usd: 1.50   # darunter: Sparbetrieb
  halt_balance_usd: 0.25  # darunter: Stopp
  # Muss den Geburtszyklus tragen, sonst bricht er mittendrin ab - und die
  # bereits bezahlte Arbeit bringt nichts.
  max_cost_per_cycle_usd: 1.50

posting:
  posts_per_day: 1
  preferred_hours: [8, 12, 18]
  max_hashtags: 20
  live: false
