# Kopiere diese Datei nach config/agent.yaml, um Werte zu überschreiben.
llm:
  model: claude-opus-5          # Strategie, Recherche, Reflexion
  cheap_model: claude-haiku-4-5 # Routinearbeit, spart Budget
  fallback_model: claude-opus-4-8
  effort: high                  # low | medium | high | xhigh | max
  max_tokens: 16000

economy:
  treasury_start_usd: 20.00
  low_balance_usd: 5.00   # darunter: Sparbetrieb (billiges Modell, weniger Recherche)
  halt_balance_usd: 0.50  # darunter: Agent stoppt und meldet sich
  max_cost_per_cycle_usd: 1.50

posting:
  posts_per_day: 1
  preferred_hours: [8, 12, 18]
  max_hashtags: 20
  live: false             # true erst, wenn du die Entwürfe geprüft hast
